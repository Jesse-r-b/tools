[project]
name = "columbus-v800-config"
version = "0.1.0"
description = "Configuration and diagnostics GUI for the Columbus V-800 MarkIII USB GNSS receiver"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
    "pyserial>=3.5",
]

[project.scripts]
v800-config = "v800.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["v800*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
